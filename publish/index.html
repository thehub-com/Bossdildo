<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ABS AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header>
  <button id="menuBtn" class="icon" aria-label="menu">☰</button>
  <div class="title">ABS AI</div>
  <button id="newChatBtn" class="icon" aria-label="new-chat">＋</button>
</header>

<!-- SIDEBAR -->
<aside id="sidebar" class="hidden" aria-hidden="true">
  <div class="sidebar-top">
    <h3>Чаты</h3>
    <button id="logoutBtn" class="small">Выйти</button>
  </div>
  <div id="chatsList"></div>
</aside>
<div id="overlay" class="hidden"></div>

<!-- AUTH (visible when not signed in) -->
<div id="auth" class="auth" role="region" aria-label="auth">
  <h1>ABS AI</h1>

  <input id="email" type="email" placeholder="Email" autocomplete="email" />
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />

  <button id="login" class="btn primary">Войти</button>
  <button id="register" class="btn">Зарегистрироваться</button>
  <button id="google" class="btn google">Войти через Google</button>
</div>

<!-- CHAT APP (visible when signed in) -->
<main id="app" class="hidden" role="main" aria-label="chat">
  <div id="chat"></div>

  <div class="input">
    <input id="prompt" placeholder="Спроси ABS AI..." autocomplete="off" />
    <button id="send" aria-label="send">➤</button>
  </div>
</main>

<!-- SCRIPTS (modules) -->
<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
